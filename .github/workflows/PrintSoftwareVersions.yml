name: Print Software Versions
on:
  push:
    branches:
      - main
jobs:
  PrintSoftwareVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Java version
        run: |
          java -version
          javac -version
  PrintDBMSVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print SQLite version
        run: sqlite3 --version
